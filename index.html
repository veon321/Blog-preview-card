<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Blog preview card</title>
    <link rel="stylesheet" href="styl.css" />
  </head>
  <body>
    <main>
      <article class="card">
        <img
          class="card-illustration"
          src="assets/images/illustration-article.svg"
          alt="Abstract vector illustration representing HTML and CSS code browser windows"
        />

        <p class="badge-learning">Learning</p>
        <p class="published-date">Published 21 Dec 2023</p>

        <h1 class="card-title">HTML & CSS foundations</h1>

        <p class="card-description">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>

        <div class="user-profile">
          <img src="assets/images/image-avatar.webp" alt="" class="avatar" />
          <span class="user-name">Greg Hooper</span>
        </div>
      </article>
    </main>
  </body>
</html>
